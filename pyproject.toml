[project]
name = "dji-droneid-spec"
version = "0.1.0"
description = "Independent CRYP/INFP packet specification and reference implementation"
requires-python = ">=3.10"
dependencies = ["cryptography>=43,<48"]

[dependency-groups]
dev = ["ruff>=0.16,<0.17"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
